<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor y Distribución - La Casa del Repuesto</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Arial', sans-serif;
            margin: 40px auto;
            max-width: 600px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #d93838;
            text-align: center;
            font-size: 28px;
        }

        .catalogo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .card-producto {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

           .card-producto img {
    width: 100%;
    height: 180px;         /* Alto fijo para mantener el orden */
    object-fit: contain;  /* Muestra la foto COMPLETA sin recortar */
    background-color: #f9f9f9; /* Fondo gris pálido si la foto es pequeña */
    border-radius: 6px;
    margin-bottom: 10px;
    cursor: pointer;      /* Manita para indicar clic */

        }

        .btn-whatsapp {
            display: inline-block;
            background-color: #25D366;
            color: white;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 10px;
        }

        .btn-regresar {
            display: inline-block;
            background-color: #555;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 20px;
        }
        /* --- Estilos para el Lightbox (Imagen Flotante) --- */
.lightbox-overlay {
    display: none; /* Oculto por defecto */
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.9); /* Fondo negro transparente */
    z-index: 10000; /* Encima de TODO */
    justify-content: center;
    align-items: center;
    cursor: pointer; /* Para cerrar al hacer clic afuera */
}

.lightbox-overlay img {
    max-width: 90%;
    max-height: 90%;
    border: 3px solid white;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(255,255,255,0.2);
    cursor: default; /* La imagen en sí no cierra */
}

/* El botón de cerrar (La X) */
.lightbox-close {
    position: absolute;
    top: 20px;
    right: 30px;
    color: white;
    font-size: 50px;
    font-weight: bold;
    cursor: pointer;
    line-height: 1;
}
    </style>
</head>
<body>
    <!-- Este es el contenedor oculto del Lightbox -->
<div id="lightboxOverlay" class="lightbox-overlay" onclick="cerrarImagen()">
    <span class="lightbox-close">&times;</span> <!-- La X de cerrar -->
    <img id="lightboxImg" src="" alt="Imagen en grande">
</div>

    <h1>🛢️ Motor y Distribución</h1>
    <p>Revisá nuestras opciones disponibles en inventario:</p>

    <div id="contenedorProductos" class="catalogo-grid">
        <p>Cargando productos...</p>
    </div>

    <a href="categorias.html" class="btn-regresar">← Volver a Categorías</a>

    <script>
        const SUPABASE_URL = "https://xcjrwstjhbgwgdpcqwmm.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_TGQTuTOiKITgHLHYoxA-MA_Bz9M94sv";


        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function cargarmotorydistribucion() {
            const contenedor = document.getElementById('contenedorProductos');

            // 🔍 FILTRO CLAVE: Solo trae los productos de esta categoría
            const { data: productos, error } = await db
                .from('productos')
                .select('*')
                .eq('categoria', 'motorydistribuicion')
                .order('id', { ascending: false });

            if (error) {
                console.error("Error:", error);
                contenedor.innerHTML = "<p>Error al cargar inventario.</p>";
                return;
            }

            if (productos.length === 0) {
                contenedor.innerHTML = "<p>No hay aceites registrados en este momento.</p>";
                return;
            }

            contenedor.innerHTML = "";

            productos.forEach(prod => {
                const mensajeWA = encodeURIComponent(`Hola, me interesa el producto: ${prod.nombre}`);
                contenedor.innerHTML += `
                    <div class="card-producto">
                       
<img src="${prod.imagen_url}" alt="${prod.nombre}" onclick="ampliarImagen('${prod.imagen_url}')">
                        <h4>${prod.nombre}</h4>
                        <p>${prod.descripcion || ''}</p>
                        <a href="https://wa.me/50233775759?text=${mensajeWA}" class="btn-whatsapp" target="_blank">Consultar por WhatsApp</a>
                    </div>
                `;
            });
        }

        cargarmotorydistribucion();
        // --- Funciones para el Lightbox ---

function ampliarImagen(url) {
    const overlay = document.getElementById('lightboxOverlay');
    const imgAmpliada = document.getElementById('lightboxImg');
    
    // Le ponemos la URL de la foto a la imagen flotante
    imgAmpliada.src = url;
    // Mostramos el contenedor (Flex lo centra)
    overlay.style.display = 'flex';
}

function cerrarImagen() {
    const overlay = document.getElementById('lightboxOverlay');
    // Simplemente ocultamos todo de nuevo
    overlay.style.display = 'none';
}
    </script>
    <script src="carrito.js"></script>
</body>
</html>
